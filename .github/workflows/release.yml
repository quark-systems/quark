name: Release

# Builds Quark for Mac (Apple silicon) and Windows, and quarkd for Linux (which Windows runs
# in WSL). A `v*` tag publishes a GitHub Release with them once its assets check out; a pull request that
# changes the release files, or a manual run, builds them as a dry run (artifacts only).
#
# Signing is used when its secrets exist, so unsigned dry runs work without any:
# - Mac: APPLE_CERTIFICATE (base64 Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_TEAM_ID; notarization adds APPLE_API_KEY (the App Store Connect .p8's text),
#   APPLE_API_KEY_ID and APPLE_API_ISSUER. They live in the `release` environment (Matt is its
#   required reviewer), which only tag builds and `sign` manual runs use; other runs are unsigned.
# - Updates: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) secrets and the TAURI_UPDATER_PUBKEY
#   variable, from `npx tauri signer generate`.
# - Windows: not yet; installers are unsigned (SmartScreen warns).
#
# 0.1 ships for Mac only: the Windows job runs only when the RELEASE_WINDOWS variable is
# "true". The release notes are the version's section of CHANGELOG.md. Publishing refreshes
# the update feed (update-feed.yml, called below: a release published with the workflow's own
# token doesn't trigger other workflows).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**", "mac/scripts/**"]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize (uses the release environment's secrets)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Release version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match Cargo.toml version $version (scripts/bump-version.sh)"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ steps.v.outputs.version }}"
          awk -v h="## $version" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  quarkd-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p quarkd
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/quarkd-x86_64-unknown-linux-gnu.tar.gz -C target/release quarkd
          cp -f packaging/wsl/install.sh dist/install-wsl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  mac:
    needs: version
    runs-on: macos-15
    # Only builds that ship (or ask to) wait for Matt's approval and get the signing secrets.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign) && 'release' || '' }}
    steps:
      # Full history: package.sh numbers QuarkBar's build (CFBundleVersion) by commit
      # count, and a shallow clone makes it 1 on every release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - name: Signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # Tauri signs, notarizes and signs updates when these are set, and fails on
          # empty ones, so only what exists goes on to the later steps.
          pass() { for k in "$@"; do [ -n "${!k}" ] && { echo "$k<<EOF"; echo "${!k}"; echo "EOF"; } >> "$GITHUB_ENV"; done; true; }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            # One keychain of our own holds the certificate for every signer: package.sh
            # (QuarkBar, inside out), Tauri (Quark.app) and the dmg. Tauri isn't given the
            # .p12, so it doesn't import a second copy and make the identity ambiguous.
            keychain="$RUNNER_TEMP/quark-signing.keychain-db"
            security create-keychain -p ci "$keychain"
            security set-keychain-settings -lut 7200 "$keychain"
            security unlock-keychain -p ci "$keychain"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$keychain" \
              | sed -n 's/.*"\(Developer ID Application: .*(\(.*\))\)"$/\1/p' \
              | grep -F "${APPLE_TEAM_ID:+($APPLE_TEAM_ID)}" | head -1)"
            if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
              security find-identity -v -p codesigning "$keychain"
              echo "::error::APPLE_CERTIFICATE has no Developer ID Application identity for team ${APPLE_TEAM_ID:-?}"
              exit 1
            fi
            echo "signing as $APPLE_SIGNING_IDENTITY"
            pass APPLE_SIGNING_IDENTITY
          else
            echo "::warning::no APPLE_CERTIFICATE: Quark.app is ad-hoc signed and not notarized"
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            # Tauri's names: APPLE_API_KEY is the key's id, the .p8 goes in a file.
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            pass APPLE_API_ISSUER
          elif [ -n "$APPLE_CERTIFICATE" ]; then
            echo "::warning::no APPLE_API_KEY: Quark.app is signed but not notarized"
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            pass TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBKEY
          fi
      - name: Build QuarkBar.app (menubar, widgets and quarkd)
        # Signed inside out by package.sh (quarkd, which is also ptyd and quark-updater, then
        # the widgets, then QuarkBar) before Tauri seals Quark.app around it.
        run: SIGN_ID="${APPLE_SIGNING_IDENTITY:-}" mac/scripts/package.sh
      - name: Build Quark.app
        working-directory: app
        run: |
          npm ci
          node ../packaging/release-config.mjs macos > "$RUNNER_TEMP/release.conf.json"
          npx tauri build --ci --target aarch64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/release.conf.json"
      - name: Check the bundle
        run: |
          app="$(ls -d app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)"
          bar="$app/Contents/Library/LoginItems/QuarkBar.app"
          test -x "$bar/Contents/MacOS/QuarkBar"
          test -d "$bar/Contents/PlugIns/QuarkWidgets.appex"
          test -f "$bar/Contents/Library/LaunchAgents/systems.quark.quarkd.plist"
          "$bar/Contents/MacOS/quarkd" --version
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 || true
      - name: Notarize the dmg
        if: env.APPLE_API_KEY_PATH != ''
        run: |
          # Tauri notarized and stapled Quark.app (so Quark.app.tar.gz, the update, carries
          # the ticket); the dmg is signed, notarized and stapled here.
          bundle=app/src-tauri/target/aarch64-apple-darwin/release/bundle
          dmg="$(ls "$bundle"/dmg/*.dmg)"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --wait --timeout 30m --output-format json \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            | tee "$RUNNER_TEMP/notary.json"
          if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            echo "::error::notarization of the dmg was not accepted"
            exit 1
          fi
          xcrun stapler staple "$dmg"
      - name: Check Gatekeeper
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          bundle=app/src-tauri/target/aarch64-apple-darwin/release/bundle
          app="$(ls -d "$bundle"/macos/*.app)"
          bar="$app/Contents/Library/LoginItems/QuarkBar.app"
          # Every layer carries the Developer ID, hardened runtime and a secure timestamp.
          for code in "$bar/Contents/MacOS/quarkd" "$bar/Contents/PlugIns/QuarkWidgets.appex" "$bar" "$app"; do
            info="$(codesign -dvv "$code" 2>&1)"
            grep -q "Authority=Developer ID Application" <<<"$info" \
              && grep -q "flags=.*runtime" <<<"$info" && grep -q "^Timestamp=" <<<"$info" \
              || { echo "$info"; echo "::error::$code is not Developer ID signed with hardened runtime"; exit 1; }
          done
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            dmg="$(ls "$bundle"/dmg/*.dmg)"
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg"
            spctl -a -vv -t exec "$app"
            spctl -a -vv -t open --context context:primary-signature "$dmg"
          fi
      - name: Collect
        run: |
          mkdir -p dist
          bundle=app/src-tauri/target/aarch64-apple-darwin/release/bundle
          cp -f "$bundle"/dmg/*.dmg dist/
          cp -f "$bundle"/macos/*.app.tar.gz* dist/ 2>/dev/null || true
          # What this build serves and writes, for the update feed (packaging/update-feed.mjs).
          "$(ls -d "$bundle"/macos/*.app)/Contents/Library/LoginItems/QuarkBar.app/Contents/MacOS/quarkd" compat --json > dist/compat.json
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    needs: version
    if: vars.RELEASE_WINDOWS == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build the installer
        working-directory: app
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          node ../packaging/release-config.mjs windows > "$RUNNER_TEMP/release.conf.json"
          npx tauri build --ci --bundles nsis --config "$RUNNER_TEMP/release.conf.json"
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp -f app/src-tauri/target/release/bundle/nsis/*-setup.exe* dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    # Waits for Windows when it runs, but doesn't need it.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.version.result == 'success' && needs.quarkd-linux.result == 'success' &&
      needs.mac.result == 'success' && needs.windows.result != 'failure'
    needs: [version, quarkd-linux, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest and checksums
        run: |
          mv -f dist/notes.md notes.md
          node packaging/latest-json.mjs "${{ needs.version.outputs.version }}" dist
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Check the assets
        env:
          UPDATER: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          ls -l dist
          compgen -G 'dist/*.dmg' >/dev/null || { echo "::error::no dmg"; exit 1; }
          test -s dist/quarkd-x86_64-unknown-linux-gnu.tar.gz || { echo "::error::no Linux quarkd"; exit 1; }
          if [ -n "$UPDATER" ]; then
            # Updates need the signed bundle, and latest.json listing it for Apple silicon.
            test -s dist/Quark.app.tar.gz && test -s dist/Quark.app.tar.gz.sig || { echo "::error::no signed update bundle"; exit 1; }
            jq -e '.platforms["darwin-aarch64"] | (.signature | length > 0) and (.url | endswith("/Quark.app.tar.gz"))' dist/latest.json \
              || { echo "::error::latest.json has no darwin-aarch64 update"; exit 1; }
            test -s dist/compat.json || { echo "::error::no compat.json"; exit 1; }
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*

  feed:
    # Rebuilds the update feed for the release just published. An explicit `if`: the default
    # success() also needs every earlier job to have run, and the Windows one is usually skipped.
    if: always() && needs.publish.result == 'success'
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/update-feed.yml
