name: Release

# Builds Quark for Mac (Apple silicon) and Windows, and quarkd for Linux (which Windows runs
# in WSL). A `v*` tag publishes a draft GitHub Release with them; a pull request that
# changes the release files, or a manual run, builds them as a dry run (artifacts only).
#
# Signing is used when its secrets exist, so unsigned dry runs work without any:
# - Mac: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY;
#   notarization adds APPLE_API_ISSUER, APPLE_API_KEY_ID and APPLE_API_KEY_P8 (the .p8's text).
# - Updates: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) secrets and the TAURI_UPDATER_PUBKEY
#   variable, from `npx tauri signer generate`.
# - Windows: not yet; installers are unsigned (SmartScreen warns).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "packaging/**"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Release version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match Cargo.toml version $version (scripts/bump-version.sh)"
            exit 1
          fi

  quarkd-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p quarkd
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/quarkd-x86_64-unknown-linux-gnu.tar.gz -C target/release quarkd
          cp -f packaging/wsl/install.sh dist/install-wsl.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  mac:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - name: Build quarkd
        run: |
          cargo build --release --locked -p quarkd
          mkdir -p app/src-tauri/binaries
          cp -f target/release/quarkd app/src-tauri/binaries/quarkd-aarch64-apple-darwin
      - name: Signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # Tauri signs, notarizes and signs updates when these are set, and fails on
          # empty ones, so only what exists goes on to the build step.
          pass() { for k in "$@"; do [ -n "${!k}" ] && { echo "$k<<EOF"; echo "${!k}"; echo "EOF"; } >> "$GITHUB_ENV"; done; true; }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            pass APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          else
            echo "::warning::no APPLE_CERTIFICATE: Quark.app is unsigned"
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            pass APPLE_API_ISSUER
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            pass TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD TAURI_UPDATER_PUBKEY
          fi
      - name: Build Quark.app
        working-directory: app
        run: |
          npm ci
          node ../packaging/release-config.mjs macos > "$RUNNER_TEMP/release.conf.json"
          npx tauri build --ci --target aarch64-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/release.conf.json"
      - name: Check the bundle
        run: |
          app="$(ls -d app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)"
          test -x "$app/Contents/MacOS/quarkd"
          "$app/Contents/MacOS/quarkd" --version
          codesign -dv "$app" 2>&1 || true
      - name: Collect
        run: |
          mkdir -p dist
          bundle=app/src-tauri/target/aarch64-apple-darwin/release/bundle
          cp -f "$bundle"/dmg/*.dmg dist/
          cp -f "$bundle"/macos/*.app.tar.gz* dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Build the installer
        working-directory: app
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.TAURI_UPDATER_PUBKEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          node ../packaging/release-config.mjs windows > "$RUNNER_TEMP/release.conf.json"
          npx tauri build --ci --bundles nsis --config "$RUNNER_TEMP/release.conf.json"
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp -f app/src-tauri/target/release/bundle/nsis/*-setup.exe* dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, quarkd-linux, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest and checksums
        run: |
          node packaging/latest-json.mjs "${{ needs.version.outputs.version }}" dist
          (cd dist && sha256sum -- * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: dist/*
