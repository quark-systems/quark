name: Mac

# The menubar app only. Runs on macOS, which costs more runner minutes, so only
# when mac/ changes.
on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quarkbar:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
