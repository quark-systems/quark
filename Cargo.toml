[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/quark-systems/quark"
rust-version = "1.85"

[workspace.dependencies]
quark-systems = { path = "crates/quark-systems", version = "0.0.1" }
quark-engine = { path = "crates/quark-engine" }
quark-transcript = { path = "crates/quark-transcript" }
quark-core = { path = "crates/quark-core" }
quark-worker = { path = "crates/quark-worker" }
quark-harness = { path = "crates/quark-harness" }
quark-sessions = { path = "crates/quark-sessions" }
quark-eventlog = { path = "crates/quark-eventlog" }
quark-isolation = { path = "crates/quark-isolation" }
quark-supervisor = { path = "crates/quark-supervisor" }
quark-worktree = { path = "crates/quark-worktree" }
quark-triggers = { path = "crates/quark-triggers" }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = "0.30"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6.0", features = ["axum_extras"] }
uuid = { version = "1", features = ["v7"] }
