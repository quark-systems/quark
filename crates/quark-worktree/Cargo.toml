[package]
name = "quark-worktree"
description = "WorktreeProvider for the native Quark engine: treehouse 3.1.2 adapter, the native pool that replaces it (slice 9) and the shadow comparing them, with the isolation assertion, tangle check and landed-work check."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
quark-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "rt"] }
tracing.workspace = true
time.workspace = true
toml = "0.9"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
libc = "0.2"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true
