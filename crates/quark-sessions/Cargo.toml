[package]
name = "quark-sessions"
description = "Terminal sessions for the native Quark engine: tmux control mode and the PTY supervisor, behind quark-core's SessionBackend."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quark-ptyd"
path = "src/bin/quark-ptyd.rs"

[dependencies]
quark-core.workspace = true
async-trait.workspace = true
base64.workspace = true
rustix = { version = "1.1", features = ["pty", "process", "termios", "fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
vt100 = "0.16"

[dev-dependencies]
tempfile = "3"
vt100 = "0.16"
