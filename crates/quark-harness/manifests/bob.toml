schema = 1
id = "bob"
name = "IBM Bob"
roles = ["worker"]

[detect]
bins = ["bob"]
version_args = ["--version"]
install_hint = "Install IBM Bob and put `bob` on PATH"

[models]
selection = "automatic"

[launch]
argv = ["bob", "chat", "--auto-approve", "--trust", "--max-turns", "500"]
# A key account's team (Quark sets BOB_TEAM_ID from the account).
optional = [["--team-id", "{env:BOB_TEAM_ID}"]]
prompt_via = "paste"
# The newest top-level task started in the worktree (bob.db `tasks`).
resume = ["--resume", "latest"]

[account]
config_dir = ".bob"
auth_env = ["BOB_API_KEY"]
auth_files = ["settings/auth-secrets.json"]
auth_exhaustive = true
# Extra accounts are API keys: Bob always keeps its login in ~/.bob.
key_env = "BOB_API_KEY"
team_env = "BOB_TEAM_ID"

[hooks]
install = "bob-settings"
events = { UserPromptSubmit = "busy", Stop = "turn_end" }

[turn_signals]
busy = "hooks"
turn_end = "hooks"
summary = "Bob hooks (UserPromptSubmit, Stop)"
idle_patterns = ["❯"]

[keys]
interrupt = ["Escape"]
exit = "/exit"

[quota]
provider = "bob"
